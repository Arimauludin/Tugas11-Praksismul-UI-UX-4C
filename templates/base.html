<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AriMa-crunch - Pedasnya Bikin Nagih{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('home') }}">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="AriMa-crunch Logo" height="45" class="me-2">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link text-light" href="{{ url_for('home') }}">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-light" href="{{ url_for('products') }}">Produk</a></li>
                    <li class="nav-item"><a class="nav-link text-light" href="{{ url_for('history') }}"><i class="fa-solid fa-clock-rotate-left me-1"></i> Riwayat</a></li>
                    <li class="nav-item">
                        <a class="btn btn-hot btn-sm ms-lg-3 px-3 mt-2 mt-lg-0" href="{{ url_for('checkout') }}">
                            <i class="fa-solid fa-cart-shopping me-1"></i> Checkout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-black text-center text-secondary py-3 mt-5 border-top border-danger">
        <div class="container">
            <p class="mb-0">&copy; 2026 AriMa-crunch. Rajanya Pedas Cabai Asli 🔥</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
