{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="fw-bold text-white"><i class="fa-solid fa-fire text-danger me-2"></i>Daftar Menu AriMa-crunch</h1>
        <p class="text-secondary">Pilih tingkat kepedasan favoritmu dan pesan sekarang!</p>
    </div>

    <div class="row g-4">
        {% for product in products %}
        <div class="col-md-4">
            <div class="card card-product h-100 text-white">
                <img src="{{ url_for('static', filename='images/' + product.image) }}" class="card-img-top" alt="{{ product.name }}">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title fw-bold">{{ product.name }}</h5>
                    <p class="card-text text-secondary flex-grow-1">{{ product.desc }}</p>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="fs-5 fw-bold text-danger">Rp {{ "{:,}".format(product.price) }}</span>
                        <a href="{{ url_for('checkout') }}" class="btn btn-hot btn-sm"><i class="fa-solid fa-cart-plus me-1"></i> Pesan</a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
